.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,40,75,.35) 0%,rgba(3,60,100,.15) 35%,rgba(3,45,80,.5) 75%,rgba(2,30,55,.8) 100%)}
.waves{position:fixed;left:0;right:0;bottom:0;height:120px;z-index:1;pointer-events:none;opacity:.5}
.waves svg{position:absolute;bottom:0;width:200%;animation:wave 9s linear infinite}
.waves svg:nth-child(2){animation-duration:14s;opacity:.6;bottom:8px}
@keyframes wave{to{transform:translateX(-50%)}}
#app{position:relative;z-index:2;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:center;padding:14px 16px 6px;position:relative}
.back{position:absolute;left:16px;top:12px;width:38px;height:38px;border-radius:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);color:#fff;font-size:22px;display:none}
.tlogo{display:flex;align-items:center;gap:8px;font:900 19px Unbounded,Nunito,sans-serif;letter-spacing:-.02em;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.tlogo i{font-style:normal;color:var(--sun);filter:drop-shadow(0 0 8px rgba(255,210,63,.8))}
.scroll{flex:1;overflow-y:auto;padding:10px 16px 120px;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.card{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px}
.hero{text-align:center;padding:20px 14px 16px}
.hstar{font-size:64px;line-height:1;color:var(--sun);filter:drop-shadow(0 0 22px rgba(255,210,63,.75));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
h1{font:900 24px Unbounded,Nunito,sans-serif;margin:10px 0 4px;letter-spacing:-.02em}
h2{font:900 17px Nunito,sans-serif;margin-bottom:10px}
.mut{color:var(--muted);font-weight:700;font-size:14px;line-height:1.4}
.lbl{font-weight:900;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:2px 2px 8px}
.inp{display:flex;align-items:center;gap:8px;background:rgba(0,20,40,.45);border:1px solid var(--line);border-radius:16px;padding:0 6px 0 14px}
.inp b{color:var(--muted);font-size:18px}
.inp input,.inp select{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:800 17px Nunito,sans-serif;padding:14px 0}
.inp select option{color:#000}
textarea.ta,input.fi,select.fi{width:100%;background:rgba(0,20,40,.45);border:1px solid var(--line);border-radius:14px;color:#fff;font:700 14px Nunito,sans-serif;padding:11px 12px;outline:0;margin-bottom:8px}
textarea.ta{min-height:76px;resize:vertical}
select.fi option{color:#000}
.mini{border:0;border-radius:12px;background:linear-gradient(135deg,var(--sun),var(--sunset));color:#4a2000;font:900 13px Nunito,sans-serif;padding:9px 12px;white-space:nowrap}
.mini.g{background:var(--glass2);color:#fff;border:1px solid var(--line)}
.hint{font-size:13px;font-weight:800;margin:7px 4px 0;min-height:18px}
.hint.ok{color:#7dffb0}.hint.bad{color:#ffb3b5}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:var(--glass2);color:#fff;border-radius:16px;padding:12px 4px;font:900 16px Nunito,sans-serif}
.chips button small{display:block;font-size:11px;color:var(--muted);font-weight:800;margin-top:2px}
.chips button.on{background:linear-gradient(135deg,var(--sun),var(--sunset));color:#4a2000;border-color:transparent}
.chips button.on small{color:#6b3300}
.pm{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--glass2);color:#fff;border-radius:18px;padding:12px 14px;margin-bottom:8px}
.pm .ic{width:44px;height:44px;border-radius:14px;overflow:hidden;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,.3)}.pm .ic img{width:100%;height:100%;object-fit:cover;display:block}
.pm .t{flex:1}.pm .t b{display:block;font-size:16px}.pm .t small{color:var(--muted);font-weight:700;font-size:12.5px}
.pm .pr{font:900 17px Nunito,sans-serif}
.pm.on{border-color:var(--sun);box-shadow:0 0 0 2px rgba(255,210,63,.55) inset;background:rgba(255,210,63,.12)}
.btn{width:100%;border:0;border-radius:18px;padding:16px;font:900 17px Nunito,system-ui,sans-serif;color:#4a2000;background:linear-gradient(135deg,var(--sun),var(--sunset));box-shadow:0 6px 18px rgba(255,138,42,.45);cursor:pointer}
.btn.blue{color:#fff;background:linear-gradient(135deg,#0ea5e9,#0369a1);box-shadow:0 6px 16px rgba(3,105,161,.45)}
.btn.ghost{color:#fff;background:var(--glass2);border:1px solid var(--line);box-shadow:none}
.btn.red{color:#fff;background:linear-gradient(135deg,#ff5a5f,#d6224f);box-shadow:none}
.btn.sm{padding:11px;font-size:14px;border-radius:14px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px}.row>*{flex:1}
.big{font:900 34px Unbounded,Nunito,sans-serif;letter-spacing:-.02em}
.copy{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(0,20,40,.45);border:1px dashed var(--line);border-radius:16px;padding:12px 14px;margin:6px 0 10px}
.copy span{font:900 18px Nunito,sans-serif;word-break:break-all}
.st{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font:900 12.5px Nunito,sans-serif;background:var(--glass2);border:1px solid var(--line)}
.st.done{background:rgba(34,180,90,.35);border-color:rgba(125,255,176,.5)}
.st.new{background:rgba(255,210,63,.22);border-color:rgba(255,210,63,.6)}
.st.paid,.st.sending{background:rgba(14,165,233,.35)}
.st.check,.st.rejected{background:rgba(255,90,95,.35);border-color:rgba(255,179,181,.6)}
.ol{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid rgba(255,255,255,.12)}
.ol:last-child{border-bottom:0}
.ol .q{font:900 16px Nunito,sans-serif}.ol .q small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.ol .r{margin-left:auto;text-align:right}
.ol .r b{display:block;font-size:14px;margin-bottom:3px}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid rgba(255,255,255,.2);border-top-color:var(--sun);animation:sp 1s linear infinite;margin:6px auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;width:calc(100% - 24px);max-width:456px;display:flex;justify-content:space-around;padding:8px 4px;border-radius:26px;background:rgba(4,40,70,.62);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);z-index:5}
.nav button{flex:1;border:0;background:none;color:var(--muted);font:800 11.5px Nunito,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;border-radius:16px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--sun)}
.nav .adm{display:none}
.tabs2{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{border:1px solid var(--line);background:var(--glass);color:#fff;font:800 13px Nunito,sans-serif;padding:8px 12px;border-radius:12px;white-space:nowrap}
.tabs2 button.on{background:linear-gradient(135deg,var(--sun),var(--sunset));color:#4a2000;border-color:transparent}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kv div{background:rgba(0,20,40,.35);border-radius:14px;padding:10px}
.kv b{display:block;font-size:18px}.kv small{color:var(--muted);font-weight:800;font-size:12px}
.tg{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-weight:800}
.sw{width:50px;height:30px;border-radius:999px;background:rgba(255,255,255,.2);position:relative;border:0;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--palm)}.sw.on::after{left:23px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fl{font-size:12.5px;font-weight:800;color:var(--muted);margin:4px 2px 4px}
.ok{color:#7dffb0}.bad{color:#ffb3b5}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-120%);background:rgba(4,40,70,.95);border:1px solid var(--line);padding:11px 16px;border-radius:16px;font-weight:800;z-index:50;transition:.25s;max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0)}
.empty{text-align:center;padding:26px 10px}
.empty div{font-size:46px;margin-bottom:6px}
a{color:var(--sun)}
</style>
</head>

</nav>
<div class="toast" id="toast"></div>

const $ = s => document.querySelector(s), V = $("#view");
const esc = s => String(s ?? "").replace(/[<>&"]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));

let poll = null;
const CHIPS = [50, 100, 250, 500, 1000, 2500];

  ru: { n: "Карта РФ", d: "Перевод + скрин, после проверки", img: "data:image/webp;base64,UklGRlIHAABXRUJQVlA4IEYHAACwIQCdASpgAGAAPlEgjUQjoiEUeZ+IOAUEtgBUk3Z9W90/KD8jvksq/9q/EHKGnIh0/oP2AP1A6i3mV/aD9gPei9IP+J9QD/R/4DrM/QA8uf2Tf2/9KLMee3z+/csWfwfrs5N/gOD/7p5l6ReZn+y3ni+kfYI/W7rJekIs9oCD3zuZJrkRZ0RYqHHIhTtGbEHcW/x9hd+jN/7/dKnPnYc6dt+NDj8LKUDwer1jJhL6RJtjCyB10svvUdsckHtPw/t3UFE7EBuJYIT2iJHeyurWfbvMT49Z80TVZUvKcGCSjBcDxWrL08kW5dK6SSlLxaIUkUz+M0CT266Cgi5DGjZMxfU1aSlQNC/PML89vOKHSqanxvgbAAD+6/Y81NpH/9scLxX+mTYf/4KLyxmJwoFp+u/b/ROQYfU053kh6pPCRHwOCPxWGx5BJ9mg6QbtHR6PlzfFPvObH0pKbgoYo8mppdPOtI2Q+utUrrnJrOvmG3snO78opvL2uy0qeLxkG4ataJCS6hhh5Ad17SPyoJm3Vce668dfp5LhYPnv7dRES7d43ytxGvlT6fEA4VAmeYn6l2qawSDwGYQosLSlTG+cZh++Usp9zyhBWWBs8zoyp1aKFfsH4g1xDwKpFb7WvZ6ypPh6Gmrs8doYYUcVLxFA1eG6If7NNeMfZV00GKdKa3Odnplyu4j+KiQvIt8YaP7SCUyV6ewDMd6CN7I+VqQFArdL0xEZ9y8dOC9gVS+JGxqCcB2CO1TESxE/+ReHhNel7s5YLfaMw40zlL5/lCFK7aWPgbbGX1OUUuv2rdERyHRN66FEdobBU7Vqk1vEvqN5QAuZmc5/sZHZe4qlB07AF7tGdwugg8qvVfUWboSWbp2JdHO+aTSdKxtj/4wGozmOM0nXX7OsZjZVeMOP8TAHq7cEmrWwpElNTtowkbVKCc6omsAFdEugOklCy5A8X02sbKCl9dZvXAV9HCYMdJd8JXRGtlzPluZAzRLis9J1aOKd2fpR7cTanJCwE8uAPvhq6I6xSrwOM5qjcqJCe24qWUwoA89e5O/7/8oJRGG/L0ryMXDJHrKiyrrmQ4hcUeqUQROlEoDK28XNQk8raY3xKkAdyYdF7SjnCssgLqJLmKgXScYRZAgkkg7DXAz0jrHFMcezqePlsI+PZvmpNq5wWnmlgxmi4fwHge1HpnANhBRRMrsGChY7L/vyigxoBvBC2YLZs47mIWHhO98XfAPP2FdUKC+g52U/ln8Y84KSmmVykkbOH2mmc9ihzcaJ9VJ4PSVUlq1unnz5R0OrKAEKmduSg13t+SL02xNWf48hgOUX0KOCHvsk3tDwhob0FlCNSsAs8ekQqvrYdLvjxl0O/zDVnz8lXMJ7OjMQgWLDzNkLDlU8En3yFBv5CYqeXg2MCdudREKkO2PzXiyb+5QlR7LOeP5t8NsjqVDekDdf/eKK9XRKZ4uFJuTa81n/V+V11yy5YhSb6X0GOLbrb7y09ODH7H0eTWFCg1NlJ5x1Jh8diyLl3nli5piW7WOZq+8Hvt+SDTzfjoBsjIkAPfgljPWI+hZJYigrHKz7jI1kfPwJvIUKGgpAAG2BEMPVlKKJt5nfivRYI4T4Yz4EslZqWoV9ZGTpuyG0Z5H5T4pLaDp98cmPD1zN09VZW8ITFnwGATrp1vu3n6aRnUMyIjJ0RRlMF8u+b7O9PEQjXGCtoAEINfe5N/+IrgeKBn5Mnry+kTria6Oa6YetQduQneWG2vANAzjur3PIMvP6Z7j6uOnu62Mmd6T1K+L9R/VG8KWvsrZFMrHH2Y4i9r5LBbsHM5K1sSxpvNt/3f8gcPv9/hB3XGN7cZmyShAeh77+zYcG7Y/tOY/mG2Ah0ggt/6u6117fTK const RATE = { mono: "uah", cp: "usd", ru: "rub" };

function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("show"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("show"), 2600); }
function haptic(t) { try { W.HapticFeedback.impactOccurred(t || "light"); } catch (e) {} }
async function api(act, data) {
  try {
    const r = await fetch("/api/" + act, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(Object.assign({ initData: W ? W.initData : "" }, data || {})) });
    const j = await r.json(); if (!j.ok && j.err) toast(j.err); return j;
  } catch (e) { toast("Нет связи, попробуй ещё раз"); return { ok: false }; }
}
function copy(t) { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("Скопировано ✅")).catch(() => { const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); toast("Скопировано ✅"); }); haptic(); }
function price(m, q) { const r = S.D.shop.rates[RATE[m]]; if (m === "mono") return Math.ceil(q * r); if (m === "cp") return (Math.ceil(q * r * 100) / 100).toFixed(2); return Math.ceil(q * r); }
const fmt = n => Number(n).toLocaleString("ru-RU");
const dt = t => new Date(t).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });

document.querySelectorAll(".nav button").forEach(b => b.onclick = () => setTab(b.dataset.t));
function setTab(t) { S.tab = t; S.stack = []; S.order = null; stopPoll(); document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.t === t)); render(); V.scrollTop = 0; }
function goBack() { stopPoll(); S.order = null; const f = S.stack.pop(); if (f) f(); else render(); }
function showBack(on) { $("#back").style.display = on ? "block" : "none"; try { on ? W.BackButton.show() : W.BackButton.hide(); } catch (e) {} }
try { W.BackButton.onClick(goBack); } catch (e) {}
function stopPoll() { if (poll) { clearInterval(poll); poll = null; } }

function render() {
  showBack(false);
  if (S.tab === "buy") return rBuy();
  if (S.tab === "orders") return rOrders();
  if (S.tab === "admin") return S.D.role === "owner" ? rAdmin() : rChecker();
}

// ---------- покупка ----------
function rBuy() {
  const sh = S.D.shop, ms = Object.keys(PM).filter(m => sh.on[m]);
  if (!ms.includes(S.method)) S.method = ms[0] || "";
  if (!S.to) S.to = S.D.me.username || "";
  V.innerHTML = `
  <div class="card hero"><div class="hstar">★</div><h1>Telegram Stars</h1><div class="mut">Звёзды на любой аккаунт — без KYC.<br>Выдача автоматически через Fragment</div></div>
  ${!ms.length ? `<div class="card empty"><div>🛠</div><b>Магазин настраивается</b><div class="mut">Загляни чуть позже</div></div>` : `
  <div class="card"><div class="lbl">Кому отправить</div>
    <div class="inp"><b>@</b><input id="to" placeholder="username" autocomplete="off" autocapitalize="off" value="${esc(S.to)}"><button class="mini g" onclick="meTo()">Себе</button></div>
    <div class="hint" id="toh"></div></div>
  <div class="card"><div class="lbl">Сколько звёзд</div>
    <div class="chips">${CHIPS.filter(c => c >= sh.min && c <= sh.max).map(c => `<button data-q="${c}" class="${S.qty === c ? "on" : ""}">${fmt(c)} ★${S.method ? `<small>${price(S.method, c)} ${PM[S.method].cur}</small>` : ""}</button>`).join("")}</div>
    <div class="inp"><b>★</b><input id="qty" type="number" inputmode="numeric" min="${sh.min}" max="${sh.max}" value="${S.qty}"><span class="mut" style="padding-right:8px">от ${sh.min}</span></div></div>
  <div class="card"><div class="lbl">Способ оплаты</div><div id="pms"></div></div>
  <button class="btn" id="buyb" onclick="buy()"></button>
  <div class="mut" style="text-align:center;margin-top:12px;font-size:12.5px">Поддержка: ${esc(S.D.support)}</div>`}`;
  if (!ms.length) return;
  V.querySelectorAll(".chips button").forEach(b => b.onclick = () => { S.qty = +b.dataset.q; $("#qty").value = S.qty; haptic(); upd(); });
  $("#qty").oninput = e => { S.qty = Math.floor(+e.target.value || 0); upd(); };
  const ti = $("#to"); ti.oninput = () => { S.to = ti.value.replace(/^@/, "").trim(); $("#toh").textContent = ""; };
  ti.onchange = checkTo;
  if (S.to) checkTo();
  upd();
}
function meTo() { if (!S.D.me.username) return toast("У тебя нет юзернейма — укажи его в настройках Telegram"); S.to = S.D.me.username; $("#to").value = S.to; checkTo(); }
let toSeq = 0;
async function checkTo() {
  const h = $("#toh"), v = S.to.replace(/^@/, ""); if (!v) return;
  if (!/^[A-Za-z0-9_]{4,32}$/.test(v)) { h.className = "hint bad"; h.textContent = "Неверный юзернейм"; return; }
  const my = ++toSeq; h.className = "hint"; h.textContent = "Проверяем…";
  const r = await api("recipient", { to: v }); if (my !== toSeq) return;
  if (r.ok) { h.className = "hint ok"; h.textContent = r.name ? "✓ " + r.name : ""; } else { h.className = "hint bad"; h.textContent = r.err || ""; }
}
function upd() {
  const sh = S.D.shop, ms = Object.keys(PM).filter(m => sh.on[m]), ok = S.qty >= sh.min && S.qty <= sh.max;
  V.querySelectorAll(".chips button").forEach(b => { b.classList.toggle("on", +b.dataset.q === S.qty); const s = b.querySelector("small"); if (s) s.textContent = price(S.method, +b.dataset.q) + " " + PM[S.method].cur; });
  $("#pms").innerHTML = ms.map(m => `<button class="pm ${m === S.method ? "on" : ""}" data-m="${m}"><span class="ic"><img src="${PM[m].img}" alt=""></span><span class="t"><b>${PM[m].n}</b><small>${PM[m].d}</small></span><span class="pr">${ok ? price(m, S.qty) + " " + PM[m].cur : "—"}</span></button>`).join("");
  V.querySelectorAll(".pm").forEach(b => b.onclick = () => { S.method = b.dataset.m; haptic(); upd(); });
  const bb = $("#buyb"); bb.disabled = !ok;
  bb.textContent = ok ? `Купить ${fmt(S.qty)} ★ за ${price(S.method, S.qty)} ${PM[S.method].cur}` : `Количество: от ${fmt(sh.min)} до ${fmt(sh.max)}`;
}
async function buy() {
  const to = S.to.replace(/^@/, "");
  if (!/^[A-Za-z0-9_]{4,32}$/.test(to)) { toast("Укажи юзернейм получателя"); $("#to").focus(); return; }
  const b = $("#buyb"); b.disabled = true; b.textContent = "Создаём заказ…";
  const r = await api("create", { to, qty: S.qty, method: S.method });
  b.disabled = false; upd();
  if (r.ok) { haptic("medium"); S.D.orders.unshift(r.order); openOrder(r.order, () => rBuy()); }
}

// ---------- заказ ----------
function openOrder(o, back) { S.stack.push(back || render); S.order = o; rOrder(); stopPoll(); poll = setInterval(refreshOrder, 4000); V.scrollTop = 0; }
async function refreshOrder() {
  if (!S.order) return stopPoll();
  const r = await fetch("/api/order", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ initData: W.initData, id: S.order.id }) }).then(r => r.json()).catch(() => null);
  if (!r || !r.ok || !S.order) return;
  const ch = r.order.status !== S.order.status; S.order = r.order;
  const i = S.D.orders.findIndex(x => x.id === r.order.id); if (i >= 0) S.D.orders[i] = r.order;
  if (ch) { haptic("medium"); rOrder(); }
  if (["done", "canceled", "rejected", "check"].includes(r.order.status)) stopPoll();
  const t = $("#tleft"); if (t) t.textContent = left(S.order.expires);
}

    <div><b>${fmt(Math.round(d.rub || 0))} ₽</b><small>получил он</small></div><div><b>${(d.ton || 0).toFixed(3)} TON</b><small>твоих потрачено</small></div></div>
    <button class="btn ghost sm" style="margin-top:10px" onclick="if(confirm('Обнулить расчёт? (после того как он вернул деньги)'))api('debt_reset').then(r=>{if(r.ok){toast('Обнулено');loadAdmin().then(rAdmin)}})">Обнулить (рассчитались)</button></div>`;
}
// ---------- проверяющий РФ ----------
async function rChecker() {
  const r = await api("admin"); if (!r.ok) return; S.A = r; const d = r.debt || {};
  const wait = r.orders.filter(o => o.status === "new" || o.status === "expired");
  V.innerHTML = `<h1 style="margin:4px 2px 12px">Карта РФ</h1>
  <div class="card"><h2>Ждут проверки (${wait.length})</h2>${wait.length ? wait.map(o => `<div class="ol"><div class="q">${fmt(o.qty)} ★ · ${esc(o.price)} ₽<small>#${o.id} · @${esc(o.to)} · ${dt(o.created)} · скрин: ${o.shot ? "✅" : "нет"}</small></div>
    <div class="r" style="display:flex;gap:6px"><button class="mini" onclick="oAct(${o.id},'paid')">✅</button><button class="mini g" onclick="oAct(${o.id},'reject')">❌</button></div></div>`).join("") : `<div class="mut">Нет заказов</div>`}
    <div class="mut" style="margin-top:8px;font-size:12.5px">Скрины приходят тебе в бот с кнопками</div></div>
  <div class="card"><h2>Реквизиты</h2><textarea class="ta" id="rud">${esc(r.ru.details)}</textarea><button class="btn sm" onclick="api('set',{ru:{details:$('#rud').value}}).then(x=>x.ok&&toast('Сохранено ✅'))">Сохранить</button></div>
  <div class="card"><h2>Итого через тебя</h2><div class="kv"><div><b>${fmt(Math.round(d.rub || 0))} ₽</b><small>получено</small></div><div><b>${fmt(d.stars || 0)} ★</b><small>выдано</small></div></div></div>
  <div class="card"><h2>История</h2>${r.orders.slice(0, 30).map(oRow).join("") || '<div class="mut">Пусто</div>'}</div>`;
}

(async () => {
  if (!W || !W.initData) { V.innerHTML = `<div class="card empty" style="margin-top:30vh"><div>⭐</div><b>Открой магазин через бота в Telegram</b></div>`; return; }
  const r = await api("init"); if (!r.ok) { V.innerHTML = `<div class="card empty" style="margin-top:30vh"><div>⚠️</div><b>${esc(r.err || "Ошибка загрузки")}</b></div>`; return; }
  S.D = r; $("#logo").textContent = r.name; document.title = r.name;
  if (r.role) document.querySelector(".nav .adm").style.display = "flex";
  if (r.role === "checker") document.querySelector(".nav .adm").lastChild.textContent = "Карта РФ";
  render();
})();
</script>
</body>
</html>
