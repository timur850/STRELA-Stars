<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>STRELA STARS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Unbounded:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--acc:#6f86ff;--acc2:#7b5cf5;--sun:#ffcf3a;--palm:#3ce08a;--bg:#151829;--card:#1e2238;--card2:#262a45;--in:#12152a;
--line:rgba(255,255,255,.08);--text:#f3f4ff;--muted:#a7abc9;--grad:linear-gradient(135deg,#6f86ff,#7b5cf5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--text);background:var(--bg);overflow:hidden}
input,textarea,select,button{font-family:inherit}
#app{position:relative;z-index:2;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:10px 14px 9px;background:rgba(21,24,41,.94);border-bottom:1px solid rgba(255,255,255,.04)}
.back{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:#fff;font-size:22px;display:none;flex:0 0 auto}
.tlogo{display:flex;align-items:center;gap:7px;font:900 18px Unbounded,Nunito,sans-serif;letter-spacing:-.02em;white-space:nowrap}
.tlogo i{font-style:normal;color:var(--sun)}
.scroll{flex:1;overflow-y:auto;padding:12px 14px 120px;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.card{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:24px;padding:14px;margin-bottom:12px}
.hero{text-align:center;padding:22px 14px 18px;background:radial-gradient(90% 90% at 50% 25%,#8a5cff,#33207a);border:1px solid rgba(255,255,255,.1);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(180deg,transparent,rgba(10,12,24,.45))}
.hero>*{position:relative}
.hstar{font-size:64px;line-height:1;color:var(--sun);filter:drop-shadow(0 10px 22px rgba(255,207,58,.55));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
h1{font:800 24px Unbounded,Nunito,sans-serif;margin:10px 0 4px;letter-spacing:-.01em}
h2{font:800 17px Unbounded,Nunito,sans-serif;margin-bottom:10px;letter-spacing:-.01em}
.mut{color:var(--muted);font-weight:700;font-size:14px;line-height:1.4}
.hero .mut{color:rgba(255,255,255,.82)}
.lbl{font-weight:900;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:2px 2px 9px}
.inp{display:flex;align-items:center;gap:8px;background:var(--in);border:1px solid var(--line);border-radius:16px;padding:0 6px 0 14px}
.inp b{color:var(--muted);font-size:18px}
.inp input,.inp select{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:800 17px Nunito,sans-serif;padding:14px 0}
.inp select option{color:#000}
textarea.ta,input.fi,select.fi{width:100%;background:var(--in);border:1px solid var(--line);border-radius:14px;color:var(--text);font:700 14px Nunito,sans-serif;padding:11px 12px;outline:0;margin-bottom:8px}
textarea.ta{min-height:76px;resize:vertical}
select.fi option{color:#000}
.mini{border:0;border-radius:12px;background:var(--grad);color:#fff;font:800 13px Nunito,sans-serif;padding:9px 12px;white-space:nowrap;box-shadow:0 4px 14px rgba(111,124,255,.35)}
.mini.g{background:var(--card2);box-shadow:none;border:1px solid var(--line)}
.hint{font-size:13px;font-weight:800;margin:7px 4px 0;min-height:18px}
.hint.ok{color:#7dffb0}.hint.bad{color:#ff8fa3}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:var(--card2);color:#fff;border-radius:16px;padding:12px 4px;font:900 16px Nunito,sans-serif}
.chips button small{display:block;font-size:11px;color:var(--muted);font-weight:800;margin-top:2px}
.chips button.on{background:var(--grad);border-color:transparent;box-shadow:0 6px 18px rgba(111,124,255,.4)}
.chips button.on small{color:rgba(255,255,255,.85)}
.pm{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card2);color:#fff;border-radius:18px;padding:12px 14px;margin-bottom:8px}
.pm .ic{width:44px;height:44px;border-radius:14px;overflow:hidden;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,.3)}.pm .ic img{width:100%;height:100%;object-fit:cover;display:block}
.pm .t{flex:1}.pm .t b{display:block;font-size:16px}.pm .t small{color:var(--muted);font-weight:700;font-size:12.5px}
.pm .pr{font:900 17px Nunito,sans-serif}
.pm.on{border-color:var(--acc2);box-shadow:0 0 0 2px rgba(123,92,245,.6) inset;background:#2c3158}
.btn{width:100%;min-height:52px;border:0;border-radius:20px;padding:15px;font:900 16.5px Nunito,system-ui,sans-serif;color:#fff;background:var(--grad);box-shadow:0 8px 22px rgba(111,124,255,.35);cursor:pointer}
.btn.blue{background:linear-gradient(135deg,#2aa8ff,#1468d8);box-shadow:0 8px 22px rgba(42,168,255,.3)}
.btn.ghost{background:var(--card2);border:1px solid var(--line);box-shadow:none}
.btn.red{background:linear-gradient(135deg,#ff5d7a,#c8264d);box-shadow:none}
.btn.sm{min-height:40px;padding:10px;font-size:14px;border-radius:16px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px}.row>*{flex:1}
.big{font:800 32px Unbounded,Nunito,sans-serif;letter-spacing:-.02em}
.copy{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--in);border:1px dashed rgba(255,255,255,.14);border-radius:16px;padding:12px 14px;margin:6px 0 10px}
.copy span{font:900 18px Nunito,sans-serif;word-break:break-all}
.st{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font:900 12.5px Nunito,sans-serif;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.st.done{background:rgba(60,224,138,.18);border-color:rgba(60,224,138,.5);color:#7dffb0}
.st.new{background:rgba(255,207,58,.14);border-color:rgba(255,207,58,.5);color:#ffe08a}
.st.paid,.st.sending{background:rgba(111,134,255,.2);border-color:rgba(111,134,255,.5);color:#c4ceff}
.st.check,.st.rejected{background:rgba(255,93,122,.18);border-color:rgba(255,93,122,.5);color:#ff9fb1}
.ol{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid rgba(255,255,255,.06)}
.ol:last-child{border-bottom:0}
.ol .q{font:900 16px Nunito,sans-serif}.ol .q small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.ol .r{margin-left:auto;text-align:right}
.ol .r b{display:block;font-size:14px;margin-bottom:3px}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid rgba(255,255,255,.12);border-top-color:var(--acc);animation:sp 1s linear infinite;margin:6px auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;width:calc(100% - 24px);max-width:456px;display:flex;gap:4px;padding:7px;border-radius:32px;background:rgba(30,34,56,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.07);z-index:5}
.nav button{flex:1;border:1px solid transparent;background:none;color:var(--muted);font:800 14.5px Nunito,sans-serif;display:flex;align-items:center;justify-content:center;padding:13px 4px;border-radius:24px}
.nav button svg{display:none}
.nav button.on{background:#2c3158;color:#fff;border-color:rgba(255,255,255,.08)}
.nav .adm{display:none}
.tabs2{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{border:1px solid var(--line);background:var(--card);color:var(--muted);font:800 13px Nunito,sans-serif;padding:9px 13px;border-radius:14px;white-space:nowrap}
.tabs2 button.on{background:#2c3158;color:#fff;border-color:rgba(255,255,255,.12)}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kv div{background:var(--card2);border-radius:16px;padding:10px 12px}
.kv b{display:block;font-size:18px}.kv small{color:var(--muted);font-weight:800;font-size:12px}
.tg{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-weight:800}
.sw{width:50px;height:30px;border-radius:999px;background:var(--card2);position:relative;border:1px solid var(--line);flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--grad);border-color:transparent}.sw.on::after{left:24px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fl{font-size:12.5px;font-weight:800;color:var(--muted);margin:4px 2px 4px}
.ok{color:#7dffb0}.bad{color:#ff8fa3}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-140%);background:#1e2238;border:1px solid var(--line);padding:11px 16px;border-radius:16px;font-weight:800;z-index:50;transition:.25s;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{transform:translate(-50%,0)}
.empty{text-align:center;padding:26px 10px}
.empty div{font-size:46px;margin-bottom:6px}
a{color:var(--acc)}
</style>
</head>

const sw = (id, on) => `<button class="sw ${on ? "on" : ""}" id="${id}" onclick="this.classList.toggle('on')"></button>`;
const isOn = id => $("#" + id).classList.contains("on");
async function save(patch, secrets) { const r = await api("set", { patch, secrets }); if (r.ok) { toast("Сохранено ✅"); await loadAdmin(); await reInit(); rAdmin(); } }
async function reInit() { const r = await api("init"); if (r.ok) S.D = r; }

function aOrders() {
  const A = S.A, st = A.stats || {}, w = A.wallet || {};
  const F = { all: ["Все", () => true], wait: ["Ожидают", o => o.status === "new"], q: ["В очереди", o => o.status === "paid" || o.status === "sending"], check: ["⚠️ Проверка", o => o.status === "check"], done: ["Выполнены", o => o.status === "done"] };
  const list = A.orders.filter(F[S.af][1]);
  $("#ab").innerHTML = `
  ${!w.ok || !A.flags.cookies ? `<div class="card" style="border-color:rgba(255,179,181,.6)"><b class="bad">⛔ Автовыдача не готова</b><div class="mut" style="margin-top:4px">${!A.flags.cookies ? "Не вставлены куки Fragment. " : ""}${!w.ok ? "Кошелёк: " + esc(w.err || "не проверен") : ""}<br>Открой вкладку «Кошелёк»</div></div>` : ""}
  <div class="card"><div class="kv">
    <div><b>${fmt(st.orders || 0)}</b><small>заказов выполнено</small></div><div><b>${fmt(st.stars || 0)} ★</b><small>звёзд продано</small></div>
    <div><b>${fmt(Math.round(st.uah || 0))} ₴</b><small>моно</small></div><div><b>${(st.usd || 0).toFixed(2)} $</b><small>CryptoBot</small></div>
    <div><b>${fmt(Math.round(st.rub || 0))} ₽</b><small>карта РФ</small></div><div><b>${(st.ton || 0).toFixed(2)} TON</b><small>потрачено на Fragment</small></div>
  </div><div class="mut" style="margin-top:10px">В очереди на выдачу: <b>${A.queue}</b>${w.ok ? ` · Баланс кошелька: <b>${(w.balance / 1e9).toFixed(2)} TON</b>` : ""}</div></div>
  <div class="tabs2">${Object.entries(F).map(([k, [n]]) => `<button data-f="${k}" class="${S.af === k ? "on" : ""}">${n}</button>`).join("")}</div>
  <div class="card">${list.length ? list.map(oRow).join("") : `<div class="mut" style="text-align:center;padding:10px">Пусто</div>`}</div>
  <button class="btn ghost sm" onclick="S.A=null;rAdmin()">🔄 Обновить</button>`;
  $("#ab").querySelectorAll("[data-f]").forEach(b => b.onclick = () => { S.af = b.dataset.f; aOrders(); });
  $("#ab").querySelectorAll(".ol").forEach(e => e.onclick = () => aOrder(A.orders.find(o => o.id === +e.dataset.id)));
}
function aOrder(o) {
  S.stack.push(rAdmin); showBack(true); V.scrollTop = 0;
  const acts = [];
  if (o.status === "new" || o.status === "expired") acts.push(["paid", "✅ Оплачен — выдать", "btn"]);
  if (o.method === "ru" && (o.status === "new" || o.status === "expired")) acts.push(["reject", "❌ Отклонить оплату", "btn red"]);
  if (o.status === "check") acts.push(["retry", "🔁 Повторить выдачу", "btn"]);
  if (o.status === "check" || o.status === "paid") acts.push(["done", "✔️ Отметить выданным (вручную)", "btn ghost"]);
  if (!["done", "sending", "canceled", "rejected"].includes(o.status)) acts.push(["cancel", "Отменить", "btn ghost"]);
  V.innerHTML = `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Заказ #${o.id}</h2><span class="st ${o.status}">${esc(o.statusText)}</span></div>
    <div style="margin-top:12px;line-height:1.75;font-weight:700">
    ⭐ <b>${fmt(o.qty)}</b> → @${esc(o.to)}<br>💳 ${PM[o.method].n}: <b>${esc(o.price)} ${o.cur}</b><br>👤 ${esc(o.uname)} (id ${o.uid})<br>🕐 ${dt(o.created)}${o.paidAt ? `<br>💰 Оплачен ${dt(o.paidAt)}${o.by ? " · " + esc(o.by) : ""}` : ""}${o.doneAt ? `<br>✅ Выдан ${dt(o.doneAt)}` : ""}${o.ton ? `<br>💎 ${(o.ton / 1e9).toFixed(4)} TON` : ""}${o.method === "ru" ? `<br>📸 Скрин: ${o.shot ? "есть (в боте)" : "нет"}` : ""}
    ${o.err ? `<br><span class="bad">⚠️ ${esc(o.err)}</span>` : ""}</div></div>
    ${acts.map(([a, n, c]) => `<button class="${c}" style="margin-bottom:8px" onclick="oAct(${o.id},'${a}')">${n}</button>`).join("")}`;
}
async function oAct(id, act) {
  if (["paid", "done", "reject", "cancel"].includes(act) && !confirm("Точно?")) return;
  const r = await api("order_act", { id, act });
  if (r.ok) { toast("Готово ✅"); await loadAdmin(); const o = (S.A.orders || []).find(x => x.id === id) || r.order; S.stack.pop(); if (o && S.D.role === "owner") aOrder(o); else render(); }
}
function aShop() {
  const s = S.A.settings;
  $("#ab").innerHTML = `
  <div class="card"><h2>Курс — цена 1 ★</h2>
    <div class="fl">Монобанк, ₴ за 1 ★</div><input class="fi" id="r_uah" type="number" step="0.001" value="${s.rates.uah}">
    <div class="fl">CryptoBot, $ за 1 ★</div><input class="fi" id="r_usd" type="number" step="0.0001" value="${s.rates.usd}">
    <div class="fl">Карта РФ, ₽ за 1 ★</div><input class="fi" id="r_rub" type="number" step="0.01" value="${s.rates.rub}">
    <div class="mut" id="rprev" style="font-size:13px"></div></div>
  <div class="card"><h2>Способы оплаты</h2>
    <div class="tg">🐈‍⬛ Монобанк ${sw("on_mono", s.on.mono)}</div><div class="tg">💎 CryptoBot ${sw("on_cp", s.on.cp)}</div><div class="tg">💳 Карта РФ ${sw("on_ru", s.on.ru)}</div>
    <div class="mut" style="font-size:12.5px">Способ показывается покупателям, только если у него задан курс</div></div>
  <div class="card"><h2>Лимиты</h2><div class="f2">
    <div><div class="fl">Мин. ★</div><input class="fi" id="min" type="number" value="${s.min}"></div><div><div class="fl">Макс. ★</div><input class="fi" id="max" type="number" value="${s.max}"></div>
    <div><div class="fl">Минут на оплату</div><input class="fi" id="ttl" type="number" value="${s.ttl}"></div><div><div class="fl">Макс. TON за 1 ★</div><input class="fi" id="mtp" type="number" step="0.001" value="${s.maxTonPerStar}"></div></div>
    <div class="mut" style="font-size:12.5px">«Макс. TON за 1 ★» — защита: если Fragment вдруг попросит дороже, бот не купит и напишет тебе</div></div>
  <button class="btn" onclick="saveShop()">Сохранить</button>`;
  const prev = () => { const u = +$("#r_uah").value, d = +$("#r_usd").value, r = +$("#r_rub").value; $("#rprev").textContent = `100 ★ = ${Math.ceil(100 * u)} ₴ · ${(Math.ceil(100 * d * 100) / 100).toFixed(2)} $ · ${Math.ceil(100 * r)} ₽`; };
  ["r_uah", "r_usd", "r_rub"].forEach(i => $("#" + i).oninput = prev); prev();
}
function saveShop() { save({ rates: { uah: $("#r_uah").value, usd: $("#r_usd").value, rub: $("#r_rub").value }, on: { mono: isOn("on_mono"), cp: isOn("on_cp"), ru: isOn("on_ru") }, min: $("#min").value, max: $("#max").value, ttl: $("#ttl").value, maxTonPerStar: $("#mtp").value }); }
function aPay() {
  const s = S.A.settings, f = S.A.flags;
  $("#ab").innerHTML = `
  <div class="card"><h2>🐈‍⬛ Монобанк</h2>
    <div class="fl">Токен (api.monobank.ua) ${f.monoToken ? '<span class="ok">— сохранён ✅</span>' : '<span class="bad">— не задан</span>'}</div>
    <input class="fi" id="mtok" placeholder="${f.monoToken ? "оставь пустым, чтобы не менять" : "вставь токен"}" autocomplete="off">
    <div class="fl">Номер карты для покупателей</div><input class="fi" id="mcard" value="${esc(s.mono.card)}" placeholder="5375 4141 0000 0000">
    <div class="fl">Получатель (имя, по желанию)</div><input class="fi" id="mhold" value="${esc(s.mono.holder)}" placeholder="Тимур Л.">
    <div class="fl">Какой счёт проверять</div><select class="fi" id="macc"><option value="${esc(s.mono.account)}">${s.mono.account === "0" ? "Основной (гривневый)" : esc(s.mono.account)}</option></select>
    <button class="mini g" style="margin-bottom:10px" onclick="monoAcc()">Загрузить мои счета и банки</button>
    <div class="tg">Писать мне о переводах без заказа ${sw("nunm", s.notifyUnmatched)}</div>
    <button class="btn sm" onclick="saveMono()">Сохранить</button>
    <div class="mut" style="margin:12px 0 8px;font-size:13px">Вебхук: ${f.monoHook ? '<span class="ok">подключён ✅</span>' : "не подключён — без него платёж находится до 1 минуты дольше"}</div>
    <button class="btn ghost sm" onclick="monoHook()">Подключить вебхук</button></div>
  <div class="card"><h2>💎 CryptoBot</h2>
    <div class="fl">Токен Crypto Pay ${f.cpToken ? '<span class="ok">— сохранён ✅</span>' : '<span class="bad">— не задан</span>'}</div>
    <input class="fi" id="ctok" placeholder="${f.cpToken ? "оставь пустым, чтобы не менять" : "123456:AA..."}" autocomplete="off">
    <button class="btn sm" onclick="save({}, {cpToken: $('#ctok').value})">Сохранить</button>
    <div class="mut" style="margin-top:12px;font-size:13px">Для мгновенного зачисления: @CryptoBot → Crypto Pay → My Apps → твоё приложение → Webhooks → вставь адрес:</div>
    <div class="copy"><span style="font-size:13px">${esc((S.A.origin || "") + "/cp")}</span><button class="mini" onclick="copy('${esc((S.A.origin || "") + "/cp")}')">Копировать</button></div></div>`;
}
function saveMono() { save({ mono: { card: $("#mcard").value, holder: $("#mhold").value, account: $("#macc").value }, notifyUnmatched: isOn("nunm") }, { monoToken: $("#mtok").value }); }
async function monoAcc() {
  const r = await api("mono_accounts"); if (!r.ok) return;
  const all = r.accounts.concat(r.jars), cur = S.A.settings.mono.account;
  $("#macc").innerHTML = `<option value="0">Основной (гривневый)</option>` + all.map(a => `<option value="${esc(a.id)}" ${a.id === cur ? "selected" : ""}>${esc(a.title)} · ${a.cur === 980 ? "₴" : a.cur} · ${fmt(a.balance)}</option>`).join("");
  toast("Счета загружены — выбери и сохрани");
}
async function monoHook() { const r = await api("mono_hook"); if (r.ok) { toast("Вебхук подключён ✅"); await loadAdmin(); aPay(); } }
function aWallet() {
  const w = S.A.wallet || {}, f = S.A.flags;
  $("#ab").innerHTML = `
  <div class="card"><h2>💎 Кошелёк для покупки звёзд</h2>
    <div style="line-height:1.8;font-weight:700;font-size:14px">
      Сид-фраза (секрет WALLET_MNEMONIC): ${f.mnemonic ? '<span class="ok">есть ✅</span>' : '<span class="bad">нет ❌</span>'}<br>
      Адрес (config.js): ${f.walletAddr ? `<span style="word-break:break-all">${esc(f.walletAddr)}</span>` : '<span class="bad">не задан ❌</span>'}<br>
      Проверка: ${w.ok ? `<span class="ok">всё ок ✅</span> · ${esc(w.version === "v5r1" ? "W5" : w.version)}<br>Баланс: <b>${(w.balance / 1e9).toFixed(3)} TON</b>` : `<span class="bad">${esc(w.err || "не проверялся")}</span>`}
    </div>
    <button class="btn sm" style="margin-top:10px" id="wcb" onclick="wCheck()">Проверить кошелёк</button></div>
  <div class="card"><h2>🧩 Fragment</h2>
    <div class="fl">Куки fragment.com ${f.cookies ? '<span class="ok">— сохранены ✅</span>' : '<span class="bad">— не заданы</span>'}</div>
    <textarea class="ta" id="fck" placeholder="stel_ssid=...; stel_dt=...; stel_token=...; stel_ton_token=..."></textarea>
    <div class="row"><button class="btn sm" onclick="save({}, {cookies: $('#fck').value})">Сохранить</button><button class="btn ghost sm" onclick="fCheck()">Проверить</button></div>
    <div class="mut" style="margin-top:10px;font-size:12.5px">На Fragment должен быть пройден KYC и подключён <b>этот же</b> кошелёк. Куки берутся из браузера на компьютере после входа (инструкция в README). Если выдача пишет «обнови куки» — вставь новые.</div></div>`;
}
async function wCheck() { const b = $("#wcb"); b.disabled = true; b.textContent = "Проверяю… (до 15 сек)"; const r = await api("wallet_check"); if (r.ok) { S.A.wallet = r.wallet; toast(r.wallet.ok ? "Кошелёк в порядке ✅" : "Ошибка: " + r.wallet.err); api("kick"); } aWallet(); }
async function fCheck() { const r = await api("frag_check"); if (r.ok) toast(r.msg); }
function aRu() {
  const s = S.A.settings, d = S.A.debt || {};
  $("#ab").innerHTML = `
  <div class="card"><h2>👮 Проверяющие карты РФ</h2>
    <div class="fl">Юзернеймы или ID через запятую. Им приходят скрины с кнопками «Подтвердить / Отклонить», в админке они видят только заказы РФ и реквизиты</div>
    <input class="fi" id="chk" value="${esc(s.ru.checkers.map(x => /^\d+$/.test(x) ? x : "@" + x).join(", "))}" placeholder="@username">
    <div class="mut" style="font-size:12.5px;margin-bottom:8px">Проверяющий должен один раз написать боту /start, иначе бот не сможет ему писать</div>
    <div class="fl">Реквизиты для покупателей</div><textarea class="ta" id="rud" placeholder="Сбер 2202 0000 0000 0000, Иван И.">${esc(s.ru.details)}</textarea>
    <button class="btn sm" onclick="save({ru:{checkers: $('#chk').value.split(/[\\s,]+/).filter(Boolean), details: $('#rud').value}})">Сохранить</button></div>
  <div class="card"><h2>📒 Расчёт с проверяющим</h2>
    <div class="mut" style="margin-bottom:10px">Деньги по картам РФ получает он, звёзды уходят с твоего кошелька${d.since ? " · с " + dt(d.since) : ""}</div>
    <div class="kv"><div><b>${fmt(d.orders || 0)}</b><small>заказов</small></div><div><b>${fmt(d.stars || 0)} ★</b><small>звёзд выдано</small></div>
    <div><b>${fmt(Math.round(d.rub || 0))} ₽</b><small>получил он</small></div><div><b>${(d.ton || 0).toFixed(3)} TON</b><small>твоих потрачено</small></div></div>
    <button class="btn ghost sm" style="margin-top:10px" onclick="if(confirm('Обнулить расчёт? (после того как он вернул деньги)'))api('debt_reset').then(r=>{if(r.ok){toast('Обнулено');loadAdmin().then(rAdmin)}})">Обнулить (рассчитались)</button></div>`;
}
// ---------- проверяющий РФ ----------
async function rChecker() {
  const r = await api("admin"); if (!r.ok) return; S.A = r; const d = r.debt || {};
  const wait = r.orders.filter(o => o.status === "new" || o.status === "expired");
  V.innerHTML = `<h1 style="margin:4px 2px 12px">Карта РФ</h1>
  <div class="card"><h2>Ждут проверки (${wait.length})</h2>${wait.length ? wait.map(o => `<div class="ol"><div class="q">${fmt(o.qty)} ★ · ${esc(o.price)} ₽<small>#${o.id} · @${esc(o.to)} · ${dt(o.created)} · скрин: ${o.shot ? "✅" : "нет"}</small></div>
    <div class="r" style="display:flex;gap:6px"><button class="mini" onclick="oAct(${o.id},'paid')">✅</button><button class="mini g" onclick="oAct(${o.id},'reject')">❌</button></div></div>`).join("") : `<div class="mut">Нет заказов</div>`}
    <div class="mut" style="margin-top:8px;font-size:12.5px">Скрины приходят тебе в бот с кнопками</div></div>
  <div class="card"><h2>Реквизиты</h2><textarea class="ta" id="rud">${esc(r.ru.details)}</textarea><button class="btn sm" onclick="api('set',{ru:{details:$('#rud').value}}).then(x=>x.ok&&toast('Сохранено ✅'))">Сохранить</button></div>
  <div class="card"><h2>Итого через тебя</h2><div class="kv"><div><b>${fmt(Math.round(d.rub || 0))} ₽</b><small>получено</small></div><div><b>${fmt(d.stars || 0)} ★</b><small>выдано</small></div></div></div>
  <div class="card"><h2>История</h2>${r.orders.slice(0, 30).map(oRow).join("") || '<div class="mut">Пусто</div>'}</div>`;
}

(async () => {
  if (!W || !W.initData) { V.innerHTML = `<div class="card empty" style="margin-top:30vh"><div>⭐</div><b>Открой магазин через бота в Telegram</b></div>`; return; }
  const r = await api("init"); if (!r.ok) { V.innerHTML = `<div class="card empty" style="margin-top:30vh"><div>⚠️</div><b>${esc(r.err || "Ошибка загрузки")}</b></div>`; return; }
  S.D = r; $("#logo").textContent = r.name; document.title = r.name;
  if (r.role) document.querySelector(".nav .adm").style.display = "flex";
  if (r.role === "checker") document.querySelector(".nav .adm").lastChild.textContent = "Карта РФ";
  render();
})();
</script>
</body>
</html>
